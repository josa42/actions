name: 'release-publish'
description: 'Create or update the GitHub release of a tag and upload its assets'
inputs:
  tag:
    description: 'Tag of the release'
    required: true
  notes:
    description: 'Release notes. Generated by GitHub when empty.'
    required: false
  files:
    description: 'Path patterns of files to upload, one per line'
    required: false
  draft:
    description: 'Create a draft release'
    required: false
    default: 'false'
  prerelease:
    description: 'Mark the release as a pre-release'
    required: false
    default: 'false'
  github-token:
    description: 'Token for the GitHub API'
    required: false
    default: '${{ github.token }}'
outputs:
  id:
    description: 'Release ID'
  url:
    description: 'Release URL'

runs:
  using: 'node24'
  main: 'index.js'
