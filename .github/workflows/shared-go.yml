name: Go

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory for Go commands'
        required: false
        type: string
        default: '.'
      lint:
        description: 'Additional lint command, run after gofmt'
        required: false
        type: string
        default: ''
    secrets:
      GIT_TOKEN:
        description: 'Token that reads private Go modules of josa42 on GitHub (optional)'
        required: false

# With a token, Go takes the modules of josa42 straight from GitHub, as the
# proxy cannot read private ones, and git sends the token.
env:
  GOPRIVATE: ${{ secrets.GIT_TOKEN != '' && 'github.com/josa42/*' || '' }}
  GIT_TOKEN: ${{ secrets.GIT_TOKEN }}

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Private modules
        if: env.GIT_TOKEN != ''
        run: git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: go build ./...

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Private modules
        if: env.GIT_TOKEN != ''
        run: git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: go test ./...

  vet:
    name: vet
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Private modules
        if: env.GIT_TOKEN != ''
        run: git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: Vet
        working-directory: ${{ inputs.working-directory }}
        run: go vet ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Private modules
        if: env.GIT_TOKEN != ''
        run: git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      - name: gofmt
        uses: josa42/actions/gofmt-lint@dist
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Lint
        if: (success() || failure()) && inputs.lint != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.lint }}
