name: Docker Multi-Arch Publish

on:
  workflow_call:
    inputs:
      image:
        description: 'Docker Hub image name (e.g. josa/myapp)'
        required: true
        type: string
      use-arm-runner:
        description: 'Use a native ARM64 runner for the ARM64 build'
        required: false
        type: boolean
        default: false
      ref:
        description: 'Ref to build, e.g. a release tag (empty: the ref that triggered the workflow)'
        required: false
        type: string
        default: ''
      version:
        description: 'Version to tag the image with, e.g. 1.2.3, in addition to latest and 1.2 (empty: latest only)'
        required: false
        type: string
        default: ''
      build-args:
        description: 'Build arguments, one KEY=value per line'
        required: false
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

# A release has a group of its own, so that a publish of the same branch
# does not cancel it before its version tags are pushed.
concurrency:
  group: docker-publish-${{ github.ref }}${{ inputs.version && format('-{0}', inputs.version) || '' }}
  cancel-in-progress: true

jobs:
  build:
    name: "build (${{ matrix.platform }})"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ${{ inputs.use-arm-runner && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.platform }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          push: true
          tags: ${{ inputs.image }}:${{ matrix.platform }}-${{ inputs.version || 'latest' }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push multi-arch manifest
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$VERSION" ]]; then
            docker buildx imagetools create \
              -t "$IMAGE:latest" \
              "$IMAGE:amd64-latest" \
              "$IMAGE:arm64-latest"
            exit 0
          fi

          # A release is also tagged with its version and major.minor, so a
          # deployment can follow 1.2 for patches only.
          IFS=. read -r major minor _ <<< "$VERSION"
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:$major.$minor" \
            "$IMAGE:amd64-$VERSION" \
            "$IMAGE:arm64-$VERSION"
