name: Main

on:
  push:
    branches: [main]
  pull_request:

jobs:
   validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p .tmp && curl -sSL 'https://json.schemastore.org/github-action.json' > .tmp/github-action.json
      - uses: thiagodnf/yaml-schema-checker@v0.0.12
        with:
          jsonSchemaFile: .tmp/github-action.json
          yamlFiles: |
            */action.yml

   go:
    uses: ./.github/workflows/go.yml

   # Runs the Go actions from source, the same way any branch without bin/ does.
   source:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: hello
        uses: ./hello
        with:
          name: source
      - shell: bash
        run: test "${{ steps.hello.outputs.greeting }}" = 'Hello, source!'
