name: Main

on:
  push:
    branches: [main]
  pull_request:

jobs:
   validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run check-jsonschema==0.38.2 --builtin-schema vendor.github-actions ./*/action.yml

   go:
    uses: ./.github/workflows/go.yml

   commits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ./conventional-commits

   # Runs the Go actions from source, the same way any branch without bin/
   # does. Needs a pull request from this repository for a writable token.
   e2e:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - id: pr
        uses: ./get-pr
        with:
          require-pr: true
      - shell: bash
        run: test "${{ steps.pr.outputs.number }}" = "${{ github.event.pull_request.number }}"

      - id: files
        uses: ./get-changed-files
        with:
          paths: |
            **
            !**/*.nothing
      - shell: bash
        run: test "${{ steps.files.outputs.matched }}" = true

      - id: comment
        if: matrix.os == 'ubuntu-latest'
        uses: ./pr-comment
        with:
          identifier: toolkit-e2e
          body: 'e2e run ${{ github.run_id }}'
      - if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: test -n "${{ steps.comment.outputs.comment-id }}"
      - if: always() && matrix.os == 'ubuntu-latest'
        uses: ./pr-comment
        with:
          action: delete
          identifier: toolkit-e2e
